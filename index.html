<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="title">Pomodoro</h1>
      <a href="settings.html" class="btn btn--icon" aria-label="설정">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
          <path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l1.9-1.5-1.9-3.3-2.3.9a7.7 7.7 0 0 0-2.6-1.5L14.1 2H9.9l-.4 2.6a7.7 7.7 0 0 0-2.6 1.5l-2.3-.9-1.9 3.3 1.9 1.5a7.9 7.9 0 0 0 0 3l-1.9 1.5 1.9 3.3 2.3-.9a7.7 7.7 0 0 0 2.6 1.5l.4 2.6h4.2l.4-2.6a7.7 7.7 0 0 0 2.6-1.5l2.3.9 1.9-3.3-1.9-1.5Z" />
        </svg>
      </a>
    </header>

    <p class="clock">현재 시간 <time id="clock">--:--:--</time></p>

    <section class="timer" aria-labelledby="timer-label">
      <p class="timer__label" id="timer-label">집중 시간</p>
      <p class="timer__display"><time id="display" datetime="PT25M">25:00</time></p>
    </section>

    <div class="controls">
      <button type="button" class="btn btn--primary" id="start">시작</button>
      <button type="button" class="btn" id="stop">정지</button>
      <button type="button" class="btn" id="reset">초기화</button>
    </div>
  </main>

  <script src="storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
